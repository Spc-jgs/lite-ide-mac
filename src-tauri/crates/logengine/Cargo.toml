[package]
name = "logengine"
version = "0.1.0"
edition = "2021"
description = "GB 级日志的 mmap + 稀疏行索引引擎（零 Tauri 依赖，可独立 bench）"

[dependencies]
memmap2 = "0.9"
memchr = "2"
# 大小写不敏感的多模式搜索，SIMD 加速（ripgrep 同作者）
aho-corasick = "1"
# 过滤框里的 /re/（2026-09-21）。按字节匹配（`regex::bytes`），文件不一定是 UTF-8。
# 本来就在依赖树里（tauri 那串拽进来的），这里只是直接引
regex = "1"
