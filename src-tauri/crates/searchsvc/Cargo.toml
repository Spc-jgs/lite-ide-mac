[package]
name = "searchsvc"
version = "0.1.0"
edition = "2021"
description = "项目文件索引与全局内容搜索（零 Tauri 依赖）"

[dependencies]
memchr = "2"
serde_json = "1"
# 匹配器（matcher.rs）。logengine 本来就依赖它、Cargo.lock 里只有一份，二进制不变大（#42 Q2 拍板）
regex = "1"

# 跳过哪些目录：与 fsservice 共用同一份名单（不共用会出「完全够不着」的目录）
excludes = { path = "../excludes" }
# 起 rg、读它的输出（两个管道并发读、丢掉就收尸）：2026-10-10 整体审核时收成一处
procutil = { path = "../procutil" }
