[package]
name = "gitsvc"
version = "0.1.0"
edition = "2021"
description = "Git 状态与差异读取（零 Tauri 依赖，走 git CLI 子进程）"

[dependencies]
# 起 git、读它的输出（两个管道并发读、有上限、丢掉就收尸）：2026-10-10 整体审核时收成一处
procutil = { path = "../procutil" }

# 取消时要杀**整个进程组**，不只是直接子进程 —— 见 remote.rs 里那段。
# 标准库能建进程组（`process_group`），但杀组只能靠 killpg。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
