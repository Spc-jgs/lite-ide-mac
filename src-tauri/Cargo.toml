[workspace]
members = ["crates/logengine", "crates/fsservice", "crates/ptysvc", "crates/searchsvc", "crates/gitsvc"]

[package]
name = "lite-ide"
version = "0.6.0"
description = "Mac 上 1 秒打开的个人工作台"
edition = "2021"

[lib]
# _lib 后缀避免与 bin 同名冲突（Tauri 官方约定）
name = "lite_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：透明窗口要它。`macOSPrivateApi: true` 和这个 feature
# 必须成对出现 —— 只写配置不加 feature，build.rs 会直接把构建拦下来
# （报的是「features 与 allowlist 不匹配」，不是「窗口不透明」）。
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
logengine = { path = "crates/logengine" }
fsservice = { path = "crates/fsservice" }
ptysvc = { path = "crates/ptysvc" }
searchsvc = { path = "crates/searchsvc" }
gitsvc = { path = "crates/gitsvc" }

# 「打开文件夹…」的原生选择框。
#
# 只在 Rust 侧用（菜单栏的处理函数里），**前端一行都不引** ——
# 引了就要把它的 JS 包拽进入口包，而入口包是首屏之前必须解析执行完的那段。
#
# 不自己撸 NSOpenPanel：判据和当初选 `trash` crate 一样 ——
# 系统面板有一堆自己的规矩（沙盒、最近位置、main thread 亲和性），
# 这些应该由维护着的库去对，不是我们。
tauri-plugin-dialog = "2"

# 窗口材质。**只在 macOS 上编进来** —— 这个 crate 在 Linux 上是空实现、
# 在 Windows 上会拽进 windows-sys，而这个项目只发 macOS。
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

# 发布构建：体积与速度并重（安装包目标 ~10MB）
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 开发时也让 logengine 跑在优化档，否则 1GB 索引会慢到没法验证
[profile.dev.package.logengine]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
