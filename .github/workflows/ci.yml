name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 跑在 macOS 上：Tauri 的构建依赖在 Linux 上要另外装一堆 GTK/WebKit，
    # 而这个项目本来就只支持 macOS，没必要为 CI 维护一套用不到的环境。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # 不写死版本：读 package.json 的 packageManager 字段。
      # 第一次跑 CI 就是栽在这儿 —— 本地 pnpm 11，CI 钉了 9，
      # 而 pnpm 9 要求 pnpm-workspace.yaml 里必须有 packages 字段，
      # 于是 `pnpm store path` 直接失败。版本只该有一个来源。
      #
      # 顺序不能反：先装 pnpm 再 setup-node，`cache: pnpm` 才找得到 store。
      - uses: pnpm/action-setup@v6
      # setup-node v6 有一条 breaking：「自动缓存」只对 npm 生效了。
      # 这里不受影响 —— 我们是显式写 `cache: pnpm`，走的不是自动那条路
      # （v7 的 action.yml 里 cache 仍然接受 npm / yarn / pnpm）。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 测试
        working-directory: src-tauri
        # 单独设步骤超时：这里有一堆真起子进程的测试（pty、任务、git、文件监听），哪条一旦挂住，
        # 宁可这一步红，也不要让它安静吃光整个 job 的额度。
        # （这句原来写「ptysvc 有已知的间歇性挂起、测试体内有 25s 看门狗」—— #16 / #30 都修了、看门狗早不在了，2026-10-12 改正）
        timeout-minutes: 25
        run: cargo test --workspace --locked

      - name: Rust 的规矩交给编译器（clippy 只查 disallowed-methods）
        working-directory: src-tauri
        # 只开这一条：全量 clippy 会冒出几百条和这件事无关的风格警告。清单和每条的理由在 src-tauri/clippy.toml；
        # 带上 test-bridge，测试通道的代码一起查（features 是叠加的，正式代码照样在里面）
        run: cargo clippy --workspace --locked --features lite-ide/test-bridge -- -A clippy::all -D clippy::disallowed_methods

      - name: 类型检查
        run: pnpm check

      - name: 前端纯函数测试
        # Node 22+ 能直接跑 .ts（原生剥类型），不引测试框架
        run: pnpm test

      - name: 构建前端
        run: pnpm build --manifest

      - name: 入口及静态依赖体积门禁
        # 精确字节、递归静态 imports、共享块去重；动态模块另测，不以切 vendor 块绕过入口线。
        # 门槛依据与历史调整见 docs/BUNDLE-GUARD.md。
        run: node scripts/bundle-budget.mjs dist

      - name: 开发桩不许进产物
        # 2026-09-07：`mock-ipc.ts`（浏览器里那份 IPC 桩，958 行）**真的漏进过
        # 生产入口包** —— 1,195 字节，产物里能直接 grep 到 `m13/git`。
        #
        # 当时 main.ts 是静态 import + `if (import.meta.env.DEV)` 条件调用，
        # 注释还写着「整个模块被 tree-shake 掉，产物里一个字节都不剩」。
        # 漏的原因是桩里那张提交图是模块级的 `[...].map(...)` ——
        # **`.map()` 是方法调用，打包器证明不了它没有副作用**，
        # 于是连同整个数据字面量一起留下了。
        #
        # 真正的保证是 main.ts 现在改成了 `await import()`：`import.meta.env.DEV`
        # 在生产构建里是常量假，整个 if 块在语法层面就被消除，不依赖 tree-shaking。
        # 这一步只是烟雾报警 —— 抓的是「有人又把它改回静态 import」。
        #
        # 哨兵取的是桩里 `MOCK_LOG` 那张假提交图里的字符串 —— **漏出来的正是它**
        # （模块级 `.map()` 那一句）。第一版哨兵里混了两条函数体内的串，
        # 实测**它们不会漏**（函数被 shake 掉了，留下的只有模块级数据），
        # 那种哨兵等于一条永远不响的报警。
        #
        # 三条都在同一个字面量里，改动它之前先看这里。
        run: |
          bad=0
          # 最后一条是测试钩子（src/lib/dev/test-hooks.ts 模块级挂的那个串，2026-10-09）：
          # 它只该出现在 VITE_TEST_BRIDGE=1 的测试构建里，正式产物里出现 = main.ts 那个死分支被改坏了
          for s in "m13/git" "合并 M12：界面打磨与使用手册" "M11 符号大纲：⌘⇧O 文件结构" "lite-test-hooks-loaded"; do
            if grep -rlF "$s" dist/assets/*.js >/dev/null 2>&1; then
              echo "::error::开发桩漏进产物了：在 dist 里找到「$s」"
              grep -rlF "$s" dist/assets/*.js
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "::error::main.ts 里桩和测试钩子那两句 import 必须是 \`await import()\`（包在 import.meta.env 的常量条件里），不能是静态 import。"
            exit 1
          fi
          echo "产物里没有开发桩的痕迹 ✓"

      - name: 构建 app（确认 Tauri 壳能编出来）
        run: pnpm app:build
