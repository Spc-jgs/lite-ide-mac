name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 跑在 macOS 上：Tauri 的构建依赖在 Linux 上要另外装一堆 GTK/WebKit，
    # 而这个项目本来就只支持 macOS，没必要为 CI 维护一套用不到的环境。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # 不写死版本：读 package.json 的 packageManager 字段。
      # 第一次跑 CI 就是栽在这儿 —— 本地 pnpm 11，CI 钉了 9，
      # 而 pnpm 9 要求 pnpm-workspace.yaml 里必须有 packages 字段，
      # 于是 `pnpm store path` 直接失败。版本只该有一个来源。
      #
      # 顺序不能反：先装 pnpm 再 setup-node，`cache: pnpm` 才找得到 store。
      - uses: pnpm/action-setup@v6
      # setup-node v6 有一条 breaking：「自动缓存」只对 npm 生效了。
      # 这里不受影响 —— 我们是显式写 `cache: pnpm`，走的不是自动那条路
      # （v7 的 action.yml 里 cache 仍然接受 npm / yarn / pnpm）。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 测试
        working-directory: src-tauri
        # 单独设步骤超时：ptysvc 的测试有已知的间歇性挂起（见 AGENTS.md），
        # 测试体内已经有 25s 看门狗，这里是第二道保险 —— 宁可这一步红，
        # 也不要让它安静吃光整个 job 的额度
        timeout-minutes: 25
        run: cargo test --workspace --locked

      - name: 类型检查
        run: pnpm check

      - name: 前端纯函数测试
        # Node 22+ 能直接跑 .ts（原生剥类型），不引测试框架
        run: pnpm test

      - name: 构建前端
        run: pnpm build

      - name: 入口包体积门禁
        # 「重的东西不进入口包」是条红线（CM6 340KB、xterm 250KB、67 个语言包
        # 全是按需加载的）。它很容易在「顺手加个 import」时破掉，而破了之后
        # 没有任何症状 —— 只是启动慢了一点。所以让 CI 盯着。
        run: |
          entry=$(grep -o 'assets/[^"]*\.js' dist/index.html | head -1)
          size=$(wc -c < "dist/$entry")
          kb=$((size / 1024))
          echo "入口包 dist/$entry = ${kb} KB"
          if [ "$kb" -gt 150 ]; then
            echo "::error::入口包 ${kb} KB 超过 150 KB 上限。"
            echo "::error::重的依赖要按需加载 —— 用 src/lib/lazy/lazy.svelte.ts 里的 lazy()。"
            exit 1
          elif [ "$kb" -gt 138 ]; then
            # 提前一轮预警。红线只有撞上才知道，而它一撞就是「CI 红了，
            # 而我这轮压根没打算动打包」—— 两轮之间悄悄涨了十几 KB
            # （M20 会话恢复 + M22 右键菜单 126 → 142，M24 又 → 148，
            # 到 M25 之后是 157）正是这么发生的。
            #
            # 2026-09-03 把线从 160/150 收到 150/138：那天拆掉 langs 的加载表
            # （-11.8KB）、把 @tauri-apps/api/webview 改成动态 import（-17.3KB），
            # 入口包 157 → 125 KB。**红线要跟着实际值收**，
            # 不然 35KB 的余量等于把绊线拆了。
            echo "::warning::入口包 ${kb} KB，离 150 KB 红线只剩 $((150 - kb)) KB。"
          fi

      - name: 开发桩不许进产物
        # 2026-09-07：`mock-ipc.ts`（浏览器里那份 IPC 桩，958 行）**真的漏进过
        # 生产入口包** —— 1,195 字节，产物里能直接 grep 到 `m13/git`。
        #
        # 当时 main.ts 是静态 import + `if (import.meta.env.DEV)` 条件调用，
        # 注释还写着「整个模块被 tree-shake 掉，产物里一个字节都不剩」。
        # 漏的原因是桩里那张提交图是模块级的 `[...].map(...)` ——
        # **`.map()` 是方法调用，打包器证明不了它没有副作用**，
        # 于是连同整个数据字面量一起留下了。
        #
        # 真正的保证是 main.ts 现在改成了 `await import()`：`import.meta.env.DEV`
        # 在生产构建里是常量假，整个 if 块在语法层面就被消除，不依赖 tree-shaking。
        # 这一步只是烟雾报警 —— 抓的是「有人又把它改回静态 import」。
        #
        # 哨兵取的是桩里 `MOCK_LOG` 那张假提交图里的字符串 —— **漏出来的正是它**
        # （模块级 `.map()` 那一句）。第一版哨兵里混了两条函数体内的串，
        # 实测**它们不会漏**（函数被 shake 掉了，留下的只有模块级数据），
        # 那种哨兵等于一条永远不响的报警。
        #
        # 三条都在同一个字面量里，改动它之前先看这里。
        run: |
          bad=0
          for s in "m13/git" "合并 M12：界面打磨与使用手册" "M11 符号大纲：⌘⇧O 文件结构"; do
            if grep -rlF "$s" dist/assets/*.js >/dev/null 2>&1; then
              echo "::error::开发桩漏进产物了：在 dist 里找到「$s」"
              grep -rlF "$s" dist/assets/*.js
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "::error::main.ts 里那句 import 必须是 \`await import()\`，不能是静态 import。"
            exit 1
          fi
          echo "产物里没有开发桩的痕迹 ✓"

      - name: 构建 app（确认 Tauri 壳能编出来）
        run: pnpm app:build
