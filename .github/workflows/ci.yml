name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 跑在 macOS 上：Tauri 的构建依赖在 Linux 上要另外装一堆 GTK/WebKit，
    # 而这个项目本来就只支持 macOS，没必要为 CI 维护一套用不到的环境。
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # 不写死版本：读 package.json 的 packageManager 字段。
      # 第一次跑 CI 就是栽在这儿 —— 本地 pnpm 11，CI 钉了 9，
      # 而 pnpm 9 要求 pnpm-workspace.yaml 里必须有 packages 字段，
      # 于是 `pnpm store path` 直接失败。版本只该有一个来源。
      #
      # 顺序不能反：先装 pnpm 再 setup-node，`cache: pnpm` 才找得到 store。
      - uses: pnpm/action-setup@v6
      # setup-node v6 有一条 breaking：「自动缓存」只对 npm 生效了。
      # 这里不受影响 —— 我们是显式写 `cache: pnpm`，走的不是自动那条路
      # （v7 的 action.yml 里 cache 仍然接受 npm / yarn / pnpm）。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 测试
        working-directory: src-tauri
        # 单独设步骤超时：ptysvc 的测试有已知的间歇性挂起（见 AGENTS.md），
        # 测试体内已经有 25s 看门狗，这里是第二道保险 —— 宁可这一步红，
        # 也不要让它安静吃光整个 job 的额度
        timeout-minutes: 25
        run: cargo test --workspace --locked

      - name: 类型检查
        run: pnpm check

      - name: 前端纯函数测试
        # Node 22+ 能直接跑 .ts（原生剥类型），不引测试框架
        run: pnpm test

      - name: 构建前端
        run: pnpm build

      - name: 入口包体积门禁
        # 「重的东西不进入口包」是条红线（CM6 340KB、xterm 250KB、67 个语言包
        # 全是按需加载的）。它很容易在「顺手加个 import」时破掉，而破了之后
        # 没有任何症状 —— 只是启动慢了一点。所以让 CI 盯着。
        run: |
          entry=$(grep -o 'assets/[^"]*\.js' dist/index.html | head -1)
          size=$(wc -c < "dist/$entry")
          kb=$((size / 1024))
          echo "入口包 dist/$entry = ${kb} KB"
          if [ "$kb" -gt 160 ]; then
            echo "::error::入口包 ${kb} KB 超过 160 KB 上限。"
            echo "::error::重的依赖要按需加载 —— 用 src/lib/lazy/lazy.svelte.ts 里的 lazy()。"
            exit 1
          fi

      - name: 构建 app（确认 Tauri 壳能编出来）
        run: pnpm app:build
