name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发的标签，如 v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # 版本读 package.json 的 packageManager 字段，与 ci.yml 一致；
      # 顺序也一致（先 pnpm 再 node，cache: pnpm 才找得到 store）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal 包要同时编两个架构
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 版本号三处必须一致
        # .dmg 的文件名取自 tauri.conf.json，三处不一致会发出一个名字对不上的包
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "标签 $want · package.json $pkg · tauri.conf.json $conf · Cargo.toml $cargo"
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$v" != "$want" ]; then
              echo "::error::版本号对不上：标签是 $want，但有一处是 $v"
              echo "::error::package.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json 三处都要改"
              exit 1
            fi
          done

      - name: 测试
        working-directory: src-tauri
        run: cargo test --workspace --locked

      # 内置的 Java 智能（docs/IDEA.md 第 10 节）：universal 包两个架构各要一份 Java 21 运行时。jlink 只认同版本的 jmods ——
      # 两个 JDK 都写 21、同一次运行里解析成同一个版本（java-bundle.sh 会核，对不上就停）；跑 jlink 的是 runner 本机（arm64）那个
      - uses: actions/setup-java@v4
        id: jdk-arm
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: actions/setup-java@v4
        id: jdk-x64
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: 准备内置的 jdtls 和 Java 运行时
        env:
          LITE_JDK21: ${{ steps.jdk-arm.outputs.path }}
          LITE_JDK21_X86_64: ${{ steps.jdk-x64.outputs.path }}
        run: scripts/java-bundle.sh aarch64 x86_64

      - name: 打 universal 包
        run: pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.java.json

      # 自动更新的包（docs/TAKEOVER.md MVP-8）：.app.tar.gz + 签名 + latest.json。私钥只在仓库的 Actions secret 里
      # （TAURI_SIGNING_PRIVATE_KEY，生成时没设密码的话 _PASSWORD 不用配）；没配就跳过，这次发布只有 .dmg、装了的人收不到更新。
      # latest.json 跟着草稿一起传，点了 Publish 才对外可见 —— 应用读的是「最新一个 Release」的下载地址（src-tauri/src/update.rs 的 MANIFEST）
      - name: 打自动更新的包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::没配 TAURI_SIGNING_PRIVATE_KEY：这次发布不带自动更新的包（docs/RELEASE.md「自动更新」）"
            exit 0
          fi
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          scripts/update-pack.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/lite-ide.app "$tag" \
            "https://github.com/${{ github.repository }}/releases/download/$tag/lite-ide.app.tar.gz" update-out

      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          assets=("$dmg")
          [ -f update-out/latest.json ] && assets+=(update-out/lite-ide.app.tar.gz update-out/latest.json)
          echo "产物：$dmg ($(du -h "$dmg" | cut -f1))"
          cat > notes.md <<'NOTES'
          ## 安装

          下载 `.dmg` → 拖进「应用程序」。

          **首次打开会被 Gatekeeper 拦住** —— 这个包没有做代码签名和公证
          （个人工具，不值得为它买开发者账号）。执行一次：

          ```bash
          xattr -dr com.apple.quarantine /Applications/lite-ide.app
          ```

          或者右键点图标 → 打开 → 再点「打开」。

          仅支持 macOS，Intel 与 Apple Silicon 都能跑（universal 包）。

          ---

          变化见下（发布前请补充）。
          NOTES
          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --notes-file notes.md \
            --draft
          echo "草稿已建好，去 GitHub 上补说明再点 Publish"
